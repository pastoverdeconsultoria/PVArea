<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d3a2d">
  <title>PV Área</title>
</head>
<body>
  <div id="map"></div>

  <div id="topbar">
    <button id="btnFolder" class="chip" type="button"></button>
    <div id="hud" class="hud hidden"></div>
  </div>

  <div id="sidebtns">
    <button id="btnLayers" class="fab" type="button" aria-label="Tipo de mapa">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Zm-7.3 9.2L2 13.7 12 19l10-5.3-2.7-1.5L12 16.1l-7.3-3.9Z"/></svg>
    </button>
    <button id="btnLocate" class="fab" type="button" aria-label="Minha posição">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-1.6A7.5 7.5 0 0 0 13 4.6V3h-2v1.6A7.5 7.5 0 0 0 4.600 11H3v2h1.600A7.5 7.5 0 0 0 11 19.400V21h2v-1.600A7.5 7.5 0 0 0 19.400 13H21v-2Zm-9 6.500a5.500 5.500 0 1 1 0-11 5.500 5.500 0 0 1 0 11Z"/></svg>
    </button>
    <button id="btnNorth" class="fab hidden" type="button" aria-label="Norte para cima">
      <svg viewBox="0 0 24 24"><path d="M12 2 7 12h10L12 2Z" fill="#d32f2f"/><path d="M7 12l5 10 5-10H7Z" fill="#9aa59d"/><text x="12" y="10.6" text-anchor="middle" font-size="5.5" font-weight="700" fill="#fff" font-family="sans-serif">N</text></svg>
    </button>
    <button id="btnFit" class="fab" type="button" aria-label="Ver tudo">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM4 15h2v3h3v2H4v-5Zm14 3v-3h2v5h-5v-2h3Z"/></svg>
    </button>
    <button id="btnSettings" class="fab" type="button" aria-label="Configurações">
      <svg viewBox="0 0 24 24"><path d="M19.400 13a7.600 7.600 0 0 0 0-2l2-1.600-2-3.400-2.400 1a7.400 7.400 0 0 0-1.700-1L15 3.500h-4l-.4 2.500a7.400 7.400 0 0 0-1.700 1l-2.400-1-2 3.400 2 1.600a7.600 7.600 0 0 0 0 2l-2 1.600 2 3.400 2.400-1a7.400 7.400 0 0 0 1.700 1l.4 2.500h4l.4-2.500a7.400 7.400 0 0 0 1.700-1l2.400 1 2-3.400-2-1.600ZM13 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z" transform="translate(-1 0)"/></svg>
    </button>
  </div>

  <div id="bottombar"></div>
  <div id="selbar" class="hidden"></div>

  <div id="sheet" class="sheet-bg"><div class="sheet" id="sheetBody"></div></div>
  <div id="modal" class="modal-bg"><div class="modal" id="modalBody"></div></div>
  <div id="toast" class="toast"></div>
  <input id="fileInput" type="file" class="hidden" multiple>
  <input id="backupInput" type="file" class="hidden" accept="application/json,.json">
  <script type="module" src="./src/main.js"></script>
</body>
</html>
